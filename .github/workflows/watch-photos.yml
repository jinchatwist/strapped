# Makes AI photos of the catalog watches and commits them. Needs the GEMINI_API_KEY repository secret.
name: Watch photos
on:
  workflow_dispatch:
    inputs:
      which:
        description: "popular, all, or watch ids separated by spaces"
        default: popular
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/watch_photos.mjs $WHICH
        env:
          WHICH: ${{ inputs.which }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit photos
        env:
          WHICH: ${{ inputs.which }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/watches data/photos.json
          git diff --cached --quiet && echo "No new photos" && exit 0
          git commit -m "Watch photos: $WHICH"
          git push
